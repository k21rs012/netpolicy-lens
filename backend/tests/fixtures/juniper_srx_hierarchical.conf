version 23.4R2-S5.5;
system {
    host-name branch-srx;
}
security {
    address-book {
        global {
            address APP-SERVER 10.10.0.10/32;
        }
    }
    policies {
        from-zone trust to-zone untrust {
            policy WEB-OUT {
                match {
                    source-address [
                        APP-SERVER
                        any
                    ];
                    destination-address any;
                    application [
                        WEB-TOOLS
                        junos-ssh
                    ];
                }
                then {
                    permit;
                }
            }
        }
    }
    zones {
        security-zone trust {
            interfaces {
                irb.10;
            }
        }
        security-zone untrust {
            interfaces {
                ge-0/0/0.0;
            }
        }
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 203.0.113.2/29;
            }
        }
    }
    irb {
        unit 10 {
            family inet {
                address 10.10.0.1/24;
            }
        }
    }
}
routing-instances {
    management {
        routing-options {
            static {
                route 0.0.0.0/0 {
                    next-hop 203.0.113.1;
                }
            }
        }
    }
}
applications {
    application CUSTOM-UDP {
        protocol udp;
        destination-port 5353;
    }
    application-set WEB-TOOLS {
        application junos-https;
        application CUSTOM-UDP;
    }
}
