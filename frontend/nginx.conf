server {
  listen 80;
  # Allow multi-file requests above nginx's 1 MiB default. Per-file and ZIP
  # limits are enforced by the API; cap the whole multipart request here.
  client_max_body_size 64m;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { proxy_pass http://backend:8000/api/; proxy_set_header Host $host; }
  location / { try_files $uri /index.html; }
}
