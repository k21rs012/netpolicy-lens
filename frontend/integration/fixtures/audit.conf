version 17.12
hostname audit
vlan 10
 name USERS
vlan 20
 name SERVERS
interface Vlan10
 ip address 10.0.1.1 255.255.255.0
 ip access-group CHECK in
interface Vlan20
 ip address 10.0.9.1 255.255.255.0
ip access-list extended CHECK
 10 permit tcp 10.0.1.0 0.0.0.255 10.0.9.0 0.0.0.255 eq 443
 20 deny ip any any
snmp-server community synthetic-test-community RO
