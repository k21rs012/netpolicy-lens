config system global
 set hostname fg
end
config system interface
 edit "wan"
  set ip 198.51.100.1 255.255.255.0
 next
 edit "lan"
  set ip 10.0.9.1 255.255.255.0
 next
end
config firewall vip
 edit "WEB"
  set extip 198.51.100.10
  set mappedip "10.0.9.20"
  set extintf "wan"
  set portforward enable
  set protocol tcp
  set extport 8443
  set mappedport 443
 next
end
config firewall policy
 edit 10
  set srcintf "wan"
  set dstintf "lan"
  set srcaddr "all"
  set dstaddr "WEB"
  set action accept
  set schedule "always"
  set service "HTTPS"
 next
end
